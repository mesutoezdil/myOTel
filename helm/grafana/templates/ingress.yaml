apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ad-otel-grafana
  namespace: ad-otel
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ad-otel-grafana
                port:
                  number: {{ .Values.service.port }}