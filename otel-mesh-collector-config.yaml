# otel-mesh-collector-config.yaml
#
# Standalone OpenTelemetry Collector config for the layer=mesh metrics pipeline.
# Extracted from helm/otelcol/templates/configmap.yaml (job_name: linkerd-mesh)
# and reduced to the mesh path only. Companion artifact for the Buoyant article
# "OTel and Mesh-Derived Metrics: A 2026 Reference."
#
# Three notes from the article lab:
#
#  1. The relabel_configs keep below (target selection by container name
#     linkerd-proxy) is verified working on OTel Collector contrib 0.118.0.
#
#  2. metric_relabel_configs keep, by contrast, is silently ignored for metric
#     filtering on this path: a Prometheus metric_relabel_configs keep rule on
#     prometheus/mesh produces no error and no effect. Use the OTTL filter/mesh
#     processor below to trim to the golden set.
#
#  3. replacement: $1:4191 requires OTel Collector contrib >= 0.118.0. Older
#     builds enable the confmap.unifyEnvVarExpansion feature gate, which treats
#     $1 as an environment-variable reference and rejects the relabel replacement
#     at startup (sourced to contrib#36160). Pin contrib 0.118.0+ so the $1
#     capture group survives expansion.
#
# Update the prometheusremotewrite endpoint to match your backend namespace.

receivers:

  prometheus/mesh:
    config:
      scrape_configs:
        - job_name: linkerd-mesh
          scrape_interval: 30s
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_container_name]
              action: keep
              regex: linkerd-proxy
            - source_labels: [__meta_kubernetes_pod_ip]
              action: replace
              target_label: __address__
              regex: (.+)
              replacement: $1:4191
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: app

processors:

  filter/mesh:
    error_mode: ignore
    metrics:
      metric:
        - 'not(name == "response_total" or IsMatch(name, "response_latency_ms.*") or name == "tcp_open_connections" or name == "tcp_read_bytes_total" or name == "tcp_write_bytes_total")'

  resource/mesh:
    attributes:
      - key: layer
        value: mesh
        action: insert

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]

  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.node.name
        - k8s.container.name

  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 10s

exporters:

  # Update this endpoint to match your VictoriaMetrics or Prometheus instance.
  # Example: http://victoriametrics.<YOUR_NAMESPACE>.svc.cluster.local:8428/api/v1/write
  prometheusremotewrite:
    endpoint: http://victoriametrics.<YOUR_NAMESPACE>.svc.cluster.local:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics/mesh:
      receivers: [prometheus/mesh]
      processors: [memory_limiter, filter/mesh, resource/mesh, resourcedetection, k8sattributes, batch]
      exporters: [prometheusremotewrite]
